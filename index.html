<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>N3MES1S</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script>
</head>
<body>
  <div class="container">
    <video id="video" autoplay playsinline muted></video>
    <canvas id="canvas"></canvas>

    <div class="hud">
      <h1>N3MES1S</h1>
      <p class="assinatura">By Cristiano Oliveira</p>
      <div id="humor">Humor: Aguardando câmera...</div>
    </div>

    <div id="painelInfo">
      <h3>BIOMETRIA</h3>
      <p><b>Tom de pele:</b> <span id="tomPele">--</span></p>
      <p><b>Idade aproximada:</b> <span id="idade">--</span></p>
      <p><b>Cor dos olhos:</b> <span id="corOlhos">--</span></p>
      <p><b>Sexo:</b> <span id="sexo">--</span></p>
    </div>

    <button id="btnEfeitos">EFEITOS</button>

    <div id="menuEfeitos" class="menu-fechado">
      <button class="filtro-btn" data-filter="none">Normal</button>
      <button class="filtro-btn" data-filter="sepia(0.8) contrast(1.1)">Vintage</button>
      <button class="filtro-btn" data-filter="hue-rotate(200deg) saturate(1.5)">Cyberpunk</button>
      <button class="filtro-btn" data-filter="grayscale(1) contrast(1.2)">B&W</button>
      <button class="filtro-btn" data-filter="brightness(1.3) saturate(1.4)">Neon</button>
      <button class="filtro-btn" data-filter="invert(1)">Negativo</button>
      <button class="filtro-btn" data-filter="sepia(1) saturate(3) hue-rotate(-20deg)">Térmico</button>
      <button class="filtro-btn" data-filter="blur(3px)">Desfocado</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
